# Автоматические тесты на Linux и на настоящем Windows: типы, unit, integration, e2e в окне Electron,
# портативная сборка и её запуск. Портативный архив для Windows сохраняется как артефакт.
name: Тесты

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      # Расчёт обязателен: без ngspice тесты падают, а не пропускаются.
      ELAB_REQUIRE_NGSPICE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Установка зависимостей
        run: npm install --no-audit --no-fund
      - name: ngspice (Linux, системный пакет)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ngspice && ngspice -v | head -3
      - name: ngspice (Windows, официальная сборка с SourceForge)
        if: runner.os == 'Windows'
        run: node scripts/fetch-ngspice.mjs
      - name: Unit-тесты
        if: success() || failure()
        shell: bash
        run: |
          npm run test:unit 2>&1 | tee out.txt; st=${PIPESTATUS[0]}
          if [ "$st" != "0" ]; then grep -E "not ok|error:|expected|actual|Error" out.txt | head -40 | sed 's/^/::error title=Unit-тесты::/'; fi
          exit $st
      - name: Интеграционные тесты
        if: success() || failure()
        shell: bash
        run: |
          npm run test:integration 2>&1 | tee out.txt; st=${PIPESTATUS[0]}
          if [ "$st" != "0" ]; then grep -E "not ok|error:|expected|actual|Error" out.txt | head -40 | sed 's/^/::error title=Интеграционные тесты::/'; fi
          exit $st
      - name: Импорт из KiCad на настоящих файлах (gitlab.com)
        if: runner.os == 'Linux' && (success() || failure())
        # Внешний сайт может быть недоступен — шаг не роняет сборку, результат виден в аннотациях.
        continue-on-error: true
        run: node --import tsx scripts/kicad-live.mts
      - name: Сборка
        run: npm run build
      - name: Портативная сборка (Linux)
        if: runner.os == 'Linux'
        run: node scripts/package.mjs linux
      - name: Портативная сборка (Windows)
        if: runner.os == 'Windows'
        run: node scripts/package.mjs win32
      - name: Проверка Windows-архива
        if: runner.os == 'Windows'
        run: node --import tsx --test tests/integration/package-win.test.ts
      - name: Пробный запуск портативной сборки (Windows)
        if: runner.os == 'Windows' && (success() || failure())
        run: node scripts/ci/run-portable.mjs
      - name: E2E (Linux, виртуальный экран)
        if: runner.os == 'Linux' && (success() || failure())
        run: xvfb-run -a npx playwright test -c tests/e2e/playwright.config.ts
      - name: E2E (Windows)
        if: runner.os == 'Windows' && (success() || failure())
        run: npx playwright test -c tests/e2e/playwright.config.ts
      - name: Проверка типов
        if: success() || failure()
        shell: bash
        # Ошибки tsc превращаются в аннотации GitHub, чтобы их было видно в интерфейсе и через API.
        run: |
          npx tsc -p tsconfig.json --noEmit --pretty false > tsc.txt || status=$?
          sed -E 's/^(.+)\(([0-9]+),([0-9]+)\): error (TS[0-9]+): (.*)$/::error file=\1,line=\2,col=\3,title=\4::\5/' tsc.txt
          exit ${status:-0}
      - name: Портативный архив для Windows
        if: runner.os == 'Windows' && (success() || failure())
        uses: actions/upload-artifact@v4
        with:
          name: ElectronLab-win-x64-portable
          path: |
            release/*.zip
            release/*.sha256
          retention-days: 30
      # Выпуск: при метке v* портативный архив прикрепляется к выпуску GitHub (хранится постоянно).
      - name: Выпуск на GitHub (метка v*)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Электронная лаборатория ${tag#v}" --notes-file docs/reports/final.md
          gh release upload "$tag" release/*.zip release/*.sha256 --clobber
